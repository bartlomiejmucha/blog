<a href="{{ include.url | relative_url }}" class="group grid gap-1 border-b border-ink/10 py-5 sm:grid-cols-12 sm:gap-6">
	<span class="text-sm uppercase tracking-[0.18em] text-ink/45 sm:col-span-2 sm:pt-1">{{ include.date | date: "%-d %b %Y" }}</span>
	<span class="text-lg leading-snug tracking-tight transition group-hover:text-ink/60 sm:col-span-7">{{ include.title }}</span>
	<span class="text-sm text-ink/40 sm:col-span-3 sm:pt-1 sm:text-right">{{ include.tags | slice: 0, 2 | join: ' · ' }}</span>
</a>
