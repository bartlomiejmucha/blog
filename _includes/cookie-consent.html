<div id="cookie-consent" data-ga-id="{{ site.google_analytics_id }}" role="dialog" aria-live="polite" aria-label="Cookie consent" class="fixed inset-x-4 bottom-4 z-[60] mx-auto hidden max-w-xl rounded-2xl border border-ink/10 bg-paper p-6 text-ink shadow-[0_20px_50px_-20px_rgba(10,10,10,.5)] sm:inset-x-6 sm:bottom-6">
	<p class="text-sm leading-relaxed text-ink/70">
		I use Google Analytics cookies to see which articles people read. They are set only if you accept. You can change your mind any time from the footer.
	</p>
	<div class="mt-5 flex gap-3">
		<button type="button" data-consent="granted" class="flex-1 rounded-full bg-ink px-5 py-2.5 text-sm font-medium text-paper transition hover:bg-ink/80">Accept</button>
		<button type="button" data-consent="denied" class="flex-1 rounded-full border border-ink/25 px-5 py-2.5 text-sm font-medium text-ink transition hover:border-ink">Reject</button>
	</div>
</div>
